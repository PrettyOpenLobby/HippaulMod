name: build
# Every push and pull request: the hygiene scan and an MSVC x86 build of
# PolHook.dll + PolShimSetup.exe, kept as a workflow artifact. A version tag
# (`vX.Y.Z`) additionally publishes a GitHub Release carrying the two
# binaries, the Steam Deck installer, the settings template and a checksum
# file, plus one zip of all of them.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python check.py --selftest
      - run: python check.py

  shim:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: take the release version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          "POLSHIM_RELEASE_VERSION=$($env:GITHUB_REF_NAME.Substring(1))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: build PolHook.dll and PolShimSetup.exe (MSVC x86)
        shell: cmd
        run: build.bat
      - name: stage the download set
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build\PolHook.dll, build\PolShimSetup.exe stage\
          Copy-Item dist\install.sh, dist\Install-PolHookProxy.ps1, dist\polshim.ini, README.md stage\
          # PolHook.dll.sha256 in `sha256sum` format: the updater and install.sh
          # compare against exactly this file when a server hosts the set
          $h = (Get-FileHash stage\PolHook.dll -Algorithm SHA256).Hash.ToLower()
          "$h  PolHook.dll" | Out-File -Encoding ascii -NoNewline stage\PolHook.dll.sha256
          # Hash everything FIRST, write afterwards. As one pipeline, Out-File
          # created stage\SHA256SUMS while Get-ChildItem was still listing
          # stage\, so the step tried to hash the file it had open for writing.
          $sums = Get-ChildItem stage -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $sums | Out-File -Encoding ascii stage\SHA256SUMS
          Compress-Archive -Path stage\* -DestinationPath HippaulMod.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hippaulmod
          path: |
            stage/
            HippaulMod.zip

  # The Windows XP build (`build.bat xp`). The runner's Visual Studio has no XP
  # toolset, so this adds the VS 2017 (v141) x86 tools and "C++ Windows XP
  # Support", which brings the 7.1A SDK and the 10.0.10240 UCRT build.bat needs.
  # Published as PolHook-xp.dll and PolShimSetup-xp.exe; the XP build's updater
  # asks for exactly those names and never for PolHook.dll.
  # windows-2022, not -latest: the newer image's Visual Studio (18) accepts the
  # XP component and quietly installs nothing.
  shim-xp:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: take the release version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          "POLSHIM_RELEASE_VERSION=$($env:GITHUB_REF_NAME.Substring(1))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: add the XP toolset to Visual Studio
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -products * -property installationPath
          $p = Start-Process -FilePath "$installer\setup.exe" -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$vs`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.v141.x86.x64',
            '--add', 'Microsoft.VisualStudio.Component.WinXP',
            '--quiet', '--norestart', '--nocache')
          # 3010 = installed, reboot suggested; nothing here needs the reboot
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "VS installer exited $($p.ExitCode)" }
          # The installer reports success for components it skipped, so look.
          $need = @(
            "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows\v7.1A\Include\Windows.h",
            "${env:ProgramFiles(x86)}\Windows Kits\10\Lib\10.0.10240.0\ucrt\x86\libucrt.lib")
          $need += Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Where-Object Name -like '14.16.*' |
                   Select-Object -First 1 | ForEach-Object { $_.FullName }
          if ($need.Count -lt 3) { throw "the v141 (14.16) tools were not installed under $vs" }
          foreach ($f in $need) { if (-not (Test-Path $f)) { throw "missing after install: $f" } }
          "XP toolset present under $vs"
      - name: build PolHook.dll and PolShimSetup.exe for Windows XP
        shell: cmd
        run: build.bat xp
      - name: check the XP binaries import nothing XP lacks
        run: python xpcheck.py build-xp\PolHook.dll build-xp\PolShimSetup.exe
      # The same check must still FAIL on the normal build (Vista and later),
      # or it has stopped seeing anything.
      - name: check that the check can fail
        shell: cmd
        run: call build.bat && python xpcheck.py --expect-fail build\PolHook.dll
      - name: stage the XP download set
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage-xp | Out-Null
          Copy-Item build-xp\PolHook.dll stage-xp\PolHook-xp.dll
          Copy-Item build-xp\PolShimSetup.exe stage-xp\PolShimSetup-xp.exe
          $h = (Get-FileHash stage-xp\PolHook-xp.dll -Algorithm SHA256).Hash.ToLower()
          "$h  PolHook-xp.dll" | Out-File -Encoding ascii -NoNewline stage-xp\PolHook-xp.dll.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hippaulmod-xp
          path: stage-xp/

  release:
    needs: [hygiene, shim, shim-xp]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hippaulmod
      - uses: actions/download-artifact@v4
        with:
          name: hippaulmod-xp
          path: stage-xp
      - name: name the zip after the tag
        run: mv HippaulMod.zip "HippaulMod-${GITHUB_REF_NAME}.zip"
      - name: add the XP files to SHA256SUMS
        run: |
          cd stage-xp
          sha256sum PolHook-xp.dll PolShimSetup-xp.exe >> ../stage/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            HippaulMod-${{ github.ref_name }}.zip
            stage/PolShimSetup.exe
            stage/PolHook.dll
            stage/PolHook.dll.sha256
            stage/install.sh
            stage/Install-PolHookProxy.ps1
            stage/polshim.ini
            stage/README.md
            stage/SHA256SUMS
            stage-xp/PolHook-xp.dll
            stage-xp/PolHook-xp.dll.sha256
            stage-xp/PolShimSetup-xp.exe
          generate_release_notes: true
